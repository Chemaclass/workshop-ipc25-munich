services:
  rock-paper-scissors-tdd:
    build: .
    container_name: ipc25-rps
    command: sh -c "composer install --no-interaction && tail -f /dev/null"
    working_dir: /srv/workshop-ipc25-munich/tdd/rps
    volumes:
      - .:/srv/workshop-ipc25-munich/tdd/rps:delegated
    environment:
      XDEBUG_MODE: debug
      XDEBUG_SESSION: PHPSTORM
