services:
  tennis-refactoring:
    build: .
    container_name: ipc25-tennis
    command: sh -c "composer install --no-interaction && tail -f /dev/null"
    volumes:
      - .:/srv/workshop-ipc25-munich/refactoring/tennis:delegated
    environment:
      XDEBUG_MODE: debug
      XDEBUG_SESSION: PHPSTORM
